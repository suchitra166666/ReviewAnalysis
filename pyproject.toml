[project]
name = "rap"
version = "0.1.0"
description = "Review Analysis Platform — self-hosted App Store and Google Play review intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "RAP contributors" }]
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.15.1",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "openai>=1.59.0",
    "google-play-scraper>=1.2.7",
    "app-store-scraper>=0.3.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "cryptography>=44.0.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "sse-starlette>=2.2.1",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    "types-python-dateutil>=2.9.0",
]

[project.scripts]
rap = "rap.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

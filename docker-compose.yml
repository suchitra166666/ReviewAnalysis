services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rap
      POSTGRES_PASSWORD: rap
      POSTGRES_DB: rap
    ports:
      - "5432:5432"
    volumes:
      - rap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rap -d rap"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["rap", "api", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://rap:rap@postgres:5432/rap
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["rap", "worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://rap:rap@postgres:5432/rap
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  rap_pgdata:
